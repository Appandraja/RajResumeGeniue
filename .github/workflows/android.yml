name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/android.yml"

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Set the repository variable ANDROID_API_URL to your HTTPS backend URL.
      VITE_API_URL: ${{ vars.ANDROID_API_URL || 'https://api.example.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Capacitor 7 / Android Gradle Plugin 8 need JDK 21. The Android SDK is preinstalled
      # on GitHub's ubuntu runners.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Guard minimum Android version (Android 13 = API 33)
        run: grep -q "minSdkVersion = 33" android/variables.gradle

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test

      - name: Build web bundle and sync into the Android project
        run: npm run android:sync

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: rajresumegenie-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
